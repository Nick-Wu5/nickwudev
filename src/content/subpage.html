<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/page.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-section">
        <span id="wuxdesign-header">WuXDesign</span>
      </div>

      <div class="content-section" id="content-section">
        <script type="module">
          const params = new URLSearchParams(window.location.search);
          const id = params.get("id");

          const entry = await Object.values(
            /** @type {Record<string, {default: Entry}>} */ (
              import.meta.glob("../content/{projects,work}/*.js", {
                eager: true,
              })
            ),
          )
            .map((module) => module.default)
            .find((entry) => entry.id === id);
          import { renderHeader, renderBody } from "../scripts/subpage.js";
          document.title = `WuXDesign | ${entry.org.name}`;
          const content = document.getElementById("content-section");
          content.innerHTML = `${renderHeader(entry)}${renderBody(entry.body)}`;
        </script>
      </div>

      <div class="footer-section" id="footer-section">
        <script type="module">
          import { renderFooter } from "../scripts/subpage.js";
          const footer = document.getElementById("footer-section");
          footer.innerHTML = renderFooter();
        </script>
      </div>
    </div>
  </body>
</html>
